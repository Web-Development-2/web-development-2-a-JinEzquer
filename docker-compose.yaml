version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: patrick_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: patrick_mysql
      MYSQL_USER: jeanpatrick_mysql
      MYSQL_PASSWORD: root_password
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - task_manager_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: task_manager_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: jeanpatrick_mysql
      PMA_PASSWORD: root_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - task_manager_network

volumes:
  db_data:

networks:
  task_manager_network:

